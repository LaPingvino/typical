<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Set preferable fonts for non-Latin</description>
	<!--
	  Noto CJK ships one face per region (JP, KR, SC, TC, HK). All of them
	  cover every CJK orthography, so the lang score ties and only the
	  family lists below would decide.  Prefer the face designed for the
	  requested language.  These blocks must come before the generic
	  lists: an earlier alias puts its family earlier in the pattern.
	  The unconditional KR entries further down stay as the default for
	  requests without a CJK language.
	  -->
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>ja</string></test>
		<prefer><family>Noto Serif CJK JP</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>ko</string></test>
		<prefer><family>Noto Serif CJK KR</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>zh-cn</string></test>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>zh-sg</string></test>
		<prefer><family>Noto Serif CJK SC</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>zh-tw</string></test>
		<prefer><family>Noto Serif CJK TC</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<test name="lang" compare="contains"><string>zh-hk</string></test>
		<prefer><family>Noto Serif CJK HK</family></prefer>
	</alias>
